[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-kinesthetic-dmps"
version = "0.1.0"
description = "ROS-free seven-joint WAM demonstration recording and DMP learning"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "h5py", "matplotlib", "pytransform3d", "pyyaml", "movement_primitives==0.9.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
wam-record = "wam_kinesthetic_dmps.cli:record"
wam-train = "wam_kinesthetic_dmps.cli:train"
wam-preview = "wam_kinesthetic_dmps.cli:preview"
wam-export = "wam_kinesthetic_dmps.replay:main"
wam-simulate = "wam_kinesthetic_dmps.cli:simulate"
wam-send-policy = "wam_kinesthetic_dmps.policy:main"

[tool.setuptools.packages.find]
where = ["src"]
